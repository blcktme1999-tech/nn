<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>线上报案 - 公安便民入口</title>
  <link rel="stylesheet" href="assets/report-room.css">
  <style>
    :root { --red:#c90822; --deep-red:#a40018; --ink:#242424; --paper:#f8f8f8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .site-header { background:#fff; border-top:3px solid #1f1f1f; }
    .masthead, .nav-inner, main, .site-footer-inner { width:min(1100px, calc(100% - 32px)); margin:auto; }
    .masthead { min-height:96px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .identity { display:block; min-width:0; flex:1; }
    .brand-left { width:100%; max-width:840px; height:auto; display:block; }
    .brand-right { width:min(240px, 28vw); min-width:130px; height:auto; display:block; }
    .return-home { border:1px solid #d7b8b8; border-radius:3px; color:#9c3340; padding:6px 12px; font-size:13px; }
    .nav-bar { background:var(--red); box-shadow:0 2px 4px #0002; }
    .nav-inner { display:flex; justify-content:space-between; }
    .nav-inner a { color:#fff; min-width:145px; padding:13px 24px; text-align:center; font-weight:700; font-size:15px; }
    .nav-inner a:hover, .nav-inner a.active { background:var(--deep-red); }
    main { min-height:670px; padding:42px 0 70px; }
    .service-panel { width:min(560px, 100%); margin:0 auto; background:#fff; border:1px solid #e3e3e3; border-top:4px solid var(--red); border-radius:7px 7px 3px 3px; box-shadow:0 5px 16px #00000018; padding:27px 32px 31px; }
    .service-panel.wide { width:min(1100px, 100%); }
    .service-panel h1, .service-panel h2 { margin:0; color:var(--red); text-align:center; font-size:24px; letter-spacing:1px; }
    .intro, .hint { margin:6px 0 18px; color:#9a9a9a; text-align:center; font-size:13px; }
    label { display:block; margin:15px 0 6px; color:#666; font-size:14px; font-weight:700; }
    input[type="text"] { width:100%; min-height:42px; padding:9px 12px; border:1px solid #bbb; border-radius:2px; color:#333; font:14px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; background:#fff; }
    input:focus { outline:2px solid #d5223740; border-color:var(--red); }
    .submit, .secondary { min-height:44px; border:0; border-radius:3px; font:700 16px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; cursor:pointer; }
    .submit { width:100%; margin-top:22px; color:#fff; background:var(--red); letter-spacing:4px; }
    .submit:hover { background:var(--deep-red); }
    .secondary { margin-top:12px; padding:0 16px; color:#9c3340; background:#fff; border:1px solid #d7b8b8; }
    .sign-pad { width:100%; height:180px; border:1px dashed #c90822; border-radius:4px; background:#fff; touch-action:none; cursor:crosshair; }
    .button-row { display:flex; gap:10px; }
    .button-row .submit, .button-row .secondary { width:auto; flex:1; margin-top:12px; }
    .result { display:none; width:min(1100px, calc(100% - 32px)); margin:16px auto 0; padding:10px 12px; border-left:3px solid #18864a; background:#edf9f1; color:#23633e; font-size:13px; line-height:1.6; }
    .result.show { display:block; }
    .result.error { border-color:#b42318; background:#fff1f0; color:#8a1c13; }
    .site-footer { background:#f0f0f0; border-top:1px solid #ddd; color:#777; }
    .site-footer-inner { padding:17px 0; font-size:12px; text-align:center; }
    @media (max-width:640px) {
      .masthead { min-height:78px; }
      .brand-right { display:none; }
      .nav-inner { overflow:auto; justify-content:flex-start; }
      .nav-inner a { min-width:auto; white-space:nowrap; padding:12px 16px; font-size:14px; }
      main { padding-top:28px; }
      .service-panel { padding:23px 22px 27px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <a class="identity" href="home.html" aria-label="返回首页">
        <img class="brand-left" src="https://cdn.phototourl.com/free/2026-07-24-aa9e6f2a-f3d3-4e47-9f03-173a0dc8ddad.png" alt="中华人民共和国公安部">
      </a>
      <img class="brand-right" src="https://cdn.phototourl.com/free/2026-07-24-24703616-4b7f-477d-b4c6-9d70ddd57ac8.png" alt="" aria-hidden="true">
      <a class="return-home" href="home.html">← 返回首页</a>
    </div>
    <nav class="nav-bar"><div class="nav-inner">
      <a href="home.html">首页</a><a class="active" href="online-report.html">便民服务</a><a href="case-search.html">案件查询</a><a href="home.html">返回主站</a>
    </div></nav>
  </header>

  <main>
    <form id="identityForm" class="service-panel">
      <h1>线上报案</h1>
      <p class="intro">请输入姓名与证件号码。须与已建档案件相符。</p>
      <label for="citizenName">姓名</label>
      <input id="citizenName" type="text" autocomplete="name" maxlength="40" placeholder="请输入姓名" required>
      <label for="certificateNumber">证件号码</label>
      <input id="certificateNumber" type="text" autocomplete="off" maxlength="20" placeholder="请输入证件号码" required>
      <button class="submit" type="submit">下一步</button>
    </form>

    <section id="caseStep" class="service-panel" hidden>
      <h2>选择案件</h2>
      <p class="hint">请选择要进入的笔录。</p>
      <div id="caseList" class="case-list"></div>
      <button id="refillBtn" class="secondary" type="button">重新填写</button>
    </section>

    <section id="signStep" class="service-panel" hidden>
      <h2>签名</h2>
      <p class="hint">笔录编号 <strong id="signCaseNumber"></strong>。请在框内签名，确认笔录内容属实。</p>
      <canvas id="signPad" class="sign-pad" width="640" height="180" aria-label="签名"></canvas>
      <div class="button-row">
        <button id="clearSignBtn" class="secondary" type="button">清除</button>
        <button id="agreeBtn" class="submit" type="button" disabled>同意</button>
      </div>
    </section>

    <section id="roomStep" class="service-panel wide" hidden></section>
    <div id="notice" class="result" aria-live="polite"></div>
  </main>

  <footer class="site-footer"><div class="site-footer-inner">线上报案须完成身份核对与签名，并开启镜头后才能进入笔录。</div></footer>
  <script src="assets/report-room.js"></script>
  <script>
    const identityForm = document.querySelector('#identityForm');
    const caseStep = document.querySelector('#caseStep');
    const signStep = document.querySelector('#signStep');
    const roomStep = document.querySelector('#roomStep');
    const caseList = document.querySelector('#caseList');
    const notice = document.querySelector('#notice');
    const pad = document.querySelector('#signPad');
    const agreeBtn = document.querySelector('#agreeBtn');
    const signCaseNumber = document.querySelector('#signCaseNumber');
    const ctx = pad.getContext('2d');
    let lookup = null;
    let selected = null;
    let drawing = false;
    let hasInk = false;
    let room = null;

    function showNotice(text, error) {
      notice.textContent = text || '';
      notice.className = text ? 'result show' + (error ? ' error' : '') : 'result';
    }
    function showIdentity() {
      identityForm.hidden = false;
      caseStep.hidden = true;
      signStep.hidden = true;
      roomStep.hidden = true;
      roomStep.innerHTML = '';
    }
    async function postJson(url, body) {
      const response = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || '请求失败。');
      return data;
    }
    function resizePad() {
      const ratio = window.devicePixelRatio || 1;
      const width = pad.clientWidth || 640;
      const snapshot = hasInk ? pad.toDataURL('image/png') : '';
      pad.width = Math.round(width * ratio);
      pad.height = Math.round(180 * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#16375b';
      if (snapshot) {
        const image = new Image();
        image.onload = () => ctx.drawImage(image, 0, 0, width, 180);
        image.src = snapshot;
      }
    }
    function point(event) {
      const rect = pad.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }
    pad.addEventListener('pointerdown', (event) => {
      drawing = true;
      pad.setPointerCapture(event.pointerId);
      const p = point(event);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    });
    pad.addEventListener('pointermove', (event) => {
      if (!drawing) return;
      const p = point(event);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      if (!hasInk) { hasInk = true; agreeBtn.disabled = false; }
    });
    pad.addEventListener('pointerup', () => { drawing = false; });
    pad.addEventListener('pointercancel', () => { drawing = false; });
    document.querySelector('#clearSignBtn').addEventListener('click', () => {
      ctx.clearRect(0, 0, pad.width, pad.height);
      hasInk = false;
      agreeBtn.disabled = true;
    });

    function openSign(caseItem) {
      selected = caseItem;
      caseStep.hidden = true;
      signStep.hidden = false;
      signCaseNumber.textContent = caseItem.caseNumber || '未提供';
      hasInk = false;
      agreeBtn.disabled = true;
      resizePad();
      ctx.clearRect(0, 0, pad.width, pad.height);
    }
    function renderCases(cases) {
      caseList.innerHTML = '';
      cases.forEach((caseItem) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.innerHTML = '<strong>' + (caseItem.caseNumber || '未命名案件') + '</strong><span>可进入笔录</span>';
        button.addEventListener('click', () => openSign(caseItem));
        caseList.appendChild(button);
      });
    }

    identityForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const citizenName = document.querySelector('#citizenName').value.trim();
      const certificateNumber = document.querySelector('#certificateNumber').value.trim();
      if (!citizenName || !certificateNumber) {
        showNotice('请输入姓名与证件号码。', true);
        return;
      }
      showNotice('正在核对资料。', false);
      try {
        const data = await postJson('/api/report-lookup', { citizenName, certificateNumber });
        lookup = { citizenName, certificateNumber, cases: data.cases || [] };
        if (!lookup.cases.length) {
          showNotice('查无资料', true);
          return;
        }
        renderCases(lookup.cases);
        identityForm.hidden = true;
        caseStep.hidden = false;
        showNotice('');
      } catch (error) {
        showNotice(error.message || '查无资料', true);
      }
    });
    document.querySelector('#refillBtn').addEventListener('click', () => {
      selected = null;
      showIdentity();
      showNotice('');
    });
    document.querySelector('#agreeBtn').addEventListener('click', async () => {
      if (!selected || !hasInk || !lookup) return;
      agreeBtn.disabled = true;
      try {
        await postJson('/api/report-signature', {
          citizenName: lookup.citizenName,
          certificateNumber: lookup.certificateNumber,
          recordId: selected.id,
          image: pad.toDataURL('image/png')
        });
        signStep.hidden = true;
        roomStep.hidden = false;
        room = await window.ReportRoom.open(roomStep, {
          uid: 'citizen-' + Date.now(),
          senderName: lookup.citizenName,
          caseInfo: selected,
          onLeave: () => {
            room = null;
            selected = null;
            showIdentity();
            showNotice('笔录已结束。', false);
          }
        });
      } catch (error) {
        roomStep.hidden = true;
        roomStep.innerHTML = '';
        identityForm.hidden = true;
        signStep.hidden = false;
        agreeBtn.disabled = !hasInk;
        showNotice(error.message || '镜头未开启，请重新进入。', true);
      }
    });
    window.addEventListener('resize', () => { if (!signStep.hidden) resizePad(); });
  </script>
  <script src="assets/site-footer.js"></script>
</body>
</html>
