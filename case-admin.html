<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案件后台管理 - 公安便民入口</title>
  <style>
    :root { --red:#c90822; --deep-red:#a40018; --ink:#242424; --line:#d8d8d8; --paper:#f8f8f8; --muted:#707070; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .site-header { background:#fff; border-top:3px solid #1f1f1f; }
    .masthead, .nav-inner, main, .site-footer-inner { width:min(1100px, calc(100% - 32px)); margin:auto; }
    .masthead { min-height:96px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .identity { display:block; min-width:0; flex:1; }
    .brand-left { width:100%; max-width:840px; height:auto; display:block; }
    .brand-right { width:min(240px, 28vw); min-width:130px; height:auto; display:block; }
    .return-home { border:1px solid #d7b8b8; border-radius:3px; color:#9c3340; padding:6px 12px; font-size:13px; }
    .nav-bar { background:var(--red); box-shadow:0 2px 4px #0002; }
    .nav-inner { display:flex; justify-content:space-between; }
    .nav-inner a { color:#fff; min-width:145px; padding:13px 24px; text-align:center; font-weight:700; font-size:15px; }
    .nav-inner a:hover, .nav-inner a.active { background:var(--deep-red); }
    main { min-height:670px; padding:42px 0 70px; }
    .panel { width:min(920px, 100%); margin:0 auto; background:#fff; border:1px solid #e3e3e3; border-top:4px solid var(--red); border-radius:7px 7px 3px 3px; box-shadow:0 5px 16px #00000018; padding:27px 32px 31px; }
    .panel h1 { margin:0; color:var(--red); text-align:center; font-size:24px; letter-spacing:1px; }
    .intro { margin:6px 0 25px; color:#9a9a9a; text-align:center; font-size:13px; }
    .field { margin-bottom:14px; }
    .field label { display:block; margin:0 0 6px; color:#666; font-size:14px; font-weight:700; }
    input, select, textarea { width:100%; min-height:42px; padding:9px 12px; border:1px solid #bbb; border-radius:2px; color:#333; font:14px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; background:#fff; box-shadow:inset 0 1px 3px #0000000d; }
    textarea { min-height:96px; resize:vertical; }
    input:focus, select:focus, textarea:focus { outline:2px solid #d5223740; border-color:var(--red); }
    .login-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .actions { margin-top:16px; }
    .submit { width:100%; min-height:44px; border:0; border-radius:3px; color:#fff; background:var(--red); box-shadow:0 2px 5px #8a001430; font:700 16px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; letter-spacing:5px; text-indent:5px; cursor:pointer; }
    .submit:hover { background:var(--deep-red); }
    .msg { margin-top:14px; border-radius:4px; display:none; padding:10px 12px; font-size:13px; line-height:1.6; }
    .msg.show { display:block; }
    .msg.error { border:1px solid #f2d7a5; background:#fff8e7; color:#835812; }
    .msg.ok { border:1px solid #cfe7d5; background:#f2fbf4; color:#246f43; }
    .admin { display:none; margin-top:18px; border:1px solid #ebebeb; border-radius:4px; overflow:hidden; }
    .admin.show { display:block; }
    .admin-head { background:#f8f8f8; padding:10px 12px; font-size:13px; color:#555; border-bottom:1px solid #ebebeb; }
    .section { padding:14px 12px 16px; border-bottom:1px solid #efefef; }
    .section:last-child { border-bottom:0; }
    .section h4 { margin:0 0 10px; color:#123c77; font-size:15px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .inline-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .admin-btn { border:0; border-radius:3px; background:var(--red); color:#fff; min-height:38px; padding:0 14px; font:700 14px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; cursor:pointer; }
    .admin-btn.alt { background:#8d1726; }
    .admin-btn.danger { background:#6b0f1a; }
    .admin-btn.danger:hover { background:#520b14; }
    .admin-note { font-size:12px; color:#666; line-height:1.6; }
    .photo-preview { margin-top:10px; max-width:220px; border:1px solid #ddd; border-radius:6px; background:#f7f7f7; overflow:hidden; }
    .photo-preview img { width:100%; display:block; }
    .photo-help { margin-top:8px; font-size:12px; color:#666; line-height:1.6; }
    .site-footer { background:#f0f0f0; border-top:1px solid #ddd; color:#777; }
    .site-footer-inner { padding:17px 0; font-size:12px; text-align:center; }
    @media (max-width:700px) {
      .masthead { min-height:78px; }
      .brand-right { display:none; }
      .brand-left { max-width:100%; }
      .return-home { padding:5px 8px; font-size:12px; }
      .nav-inner { overflow:auto; justify-content:flex-start; }
      .nav-inner a { min-width:auto; white-space:nowrap; padding:12px 16px; font-size:14px; }
      .panel { padding:23px 22px 27px; }
      .login-grid { grid-template-columns:1fr; }
      .form-row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <a class="identity" href="index (2).html" aria-label="返回首页">
        <img class="brand-left" src="https://cdn.phototourl.com/free/2026-07-24-aa9e6f2a-f3d3-4e47-9f03-173a0dc8ddad.png" alt="中华人民共和国公安部">
      </a>
      <img class="brand-right" src="https://cdn.phototourl.com/free/2026-07-24-24703616-4b7f-477d-b4c6-9d70ddd57ac8.png" alt="" aria-hidden="true">
      <a class="return-home" href="index (2).html">← 返回首页</a>
    </div>
    <nav class="nav-bar"><div class="nav-inner">
      <a href="index (2).html">首页</a><a href="mm1.html">便民服务</a><a href="case-search.html">案件查询</a><a class="active" href="case-admin.html">后台管理</a>
    </div></nav>
  </header>

  <main>
    <section class="panel">
      <h1>案件后台管理</h1>
      <p class="intro">此页提供给管理员（你的客户）维护数据库：姓名、案件编号、内容与照片。前台查询会用姓名加案件编号对应资料。</p>

      <form id="loginForm">
        <div class="login-grid">
          <div class="field">
            <label for="adminLogin">登录账号</label>
            <input id="adminLogin" value="blcktme1999" readonly>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
          </div>
        </div>
        <div class="actions"><button class="submit" type="submit">登 入 后 台</button></div>
      </form>

      <div id="message" class="msg" aria-live="polite"></div>

      <div id="adminPanel" class="admin" aria-live="polite">
        <div class="admin-head">资料维护操作</div>

        <div class="section">
          <h4>基本资料</h4>
          <div class="form-row">
            <div class="field">
              <label for="displayNameEdit">姓名</label>
              <input id="displayNameEdit" placeholder="例如：王小明">
            </div>
            <div class="field">
              <label for="avatarUrlEdit">头像网址</label>
              <input id="avatarUrlEdit" placeholder="https://...">
            </div>
            <div class="field">
              <label for="issuingPlaceEdit">发证地</label>
              <input id="issuingPlaceEdit" placeholder="例如：北京市">
            </div>
            <div class="field">
              <label for="idNumberEdit">证件号码</label>
              <input id="idNumberEdit" placeholder="例如：A123456789">
            </div>
          </div>
          <div class="inline-actions"><button class="admin-btn" id="saveProfileBtn" type="button">保存基本资料</button></div>
        </div>

        <div class="section">
          <h4>案件资料</h4>
          <p class="admin-note">你可以先选择已有案件更新，或直接新增新案件。</p>
          <div class="form-row">
            <div class="field">
              <label for="recordSelect">选择已有案件（更新用）</label>
              <select id="recordSelect"></select>
            </div>
            <div class="field">
              <label for="recordTitleEdit">案件编号</label>
              <input id="recordTitleEdit" placeholder="例如：A-2026-0001">
            </div>
          </div>
          <div class="field">
            <label for="recordInfoEdit">案件说明</label>
            <textarea id="recordInfoEdit" placeholder="输入案件内容说明"></textarea>
          </div>
          <div class="inline-actions">
            <button class="admin-btn" id="updateRecordBtn" type="button">更新所选案件</button>
            <button class="admin-btn alt" id="createRecordBtn" type="button">新增案件</button>
            <button class="admin-btn danger" id="deleteRecordBtn" type="button">删除所选案件</button>
          </div>
        </div>

        <div class="section">
          <h4>新增照片</h4>
          <div class="form-row">
            <div class="field">
              <label for="photoRecordSelect">应用到哪笔案件</label>
              <select id="photoRecordSelect"></select>
            </div>
            <div class="field">
              <label for="photoCaptionInput">照片说明</label>
              <input id="photoCaptionInput" placeholder="例如：现场正面照">
            </div>
          </div>
          <div class="field">
            <label for="photoFileInput">上传照片</label>
            <input id="photoFileInput" type="file" accept="image/*">
            <div class="photo-help">可直接选择手机或电脑照片，系统会自动压缩后上传。</div>
            <div id="photoPreview" class="photo-preview" hidden><img id="photoPreviewImg" alt="照片预览"></div>
          </div>
          <div class="inline-actions"><button class="admin-btn" id="addPhotoBtn" type="button">新增照片</button></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="site-footer-inner">本页为管理员专用，请勿提供给普通案件查询用户。</div></footer>

  <script>
    const loginForm = document.querySelector('#loginForm');
    const adminLoginInput = document.querySelector('#adminLogin');
    const passwordInput = document.querySelector('#password');
    const messageBox = document.querySelector('#message');
    const adminPanel = document.querySelector('#adminPanel');
    const displayNameEdit = document.querySelector('#displayNameEdit');
    const avatarUrlEdit = document.querySelector('#avatarUrlEdit');
    const issuingPlaceEdit = document.querySelector('#issuingPlaceEdit');
    const idNumberEdit = document.querySelector('#idNumberEdit');
    const recordSelect = document.querySelector('#recordSelect');
    const recordTitleEdit = document.querySelector('#recordTitleEdit');
    const recordInfoEdit = document.querySelector('#recordInfoEdit');
    const photoRecordSelect = document.querySelector('#photoRecordSelect');
    const photoCaptionInput = document.querySelector('#photoCaptionInput');
    const photoFileInput = document.querySelector('#photoFileInput');
    const photoPreview = document.querySelector('#photoPreview');
    const photoPreviewImg = document.querySelector('#photoPreviewImg');
    const saveProfileBtn = document.querySelector('#saveProfileBtn');
    const updateRecordBtn = document.querySelector('#updateRecordBtn');
    const createRecordBtn = document.querySelector('#createRecordBtn');
    const deleteRecordBtn = document.querySelector('#deleteRecordBtn');
    const addPhotoBtn = document.querySelector('#addPhotoBtn');

    const SHARED_ADMIN_LOGIN = 'blcktme1999';

    let recordsCache = [];

    function showMessage(text, type = 'ok') {
      messageBox.textContent = text;
      messageBox.className = 'msg show ' + type;
    }

    function clearMessage() {
      messageBox.textContent = '';
      messageBox.className = 'msg';
    }

    function escapeText(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char] || char));
    }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('图片读取失败，请改用 JPG 或 PNG。'));
          img.src = String(reader.result || '');
        };
        reader.onerror = () => reject(new Error('图片读取失败，请重新选择文件。'));
        reader.readAsDataURL(file);
      });
    }

    async function fileToCompressedDataUrl(file) {
      const image = await fileToImage(file);
      const maxWidth = 1600;
      const maxHeight = 1600;
      const ratio = Math.min(maxWidth / image.width, maxHeight / image.height, 1);
      const width = Math.max(1, Math.round(image.width * ratio));
      const height = Math.max(1, Math.round(image.height * ratio));

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      if (!ctx) {
        throw new Error('浏览器不支持图片处理，请改用较新版本浏览器。');
      }
      ctx.drawImage(image, 0, 0, width, height);

      let dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      if (dataUrl.length > 1900000) {
        dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      }
      if (dataUrl.length > 1900000) {
        throw new Error('照片文件仍过大，请选择较小照片后再上传。');
      }
      return dataUrl;
    }

    async function uploadImageAndGetUrl(dataUrl, fileName) {
      const data = await requestJson('/api/admin/upload-image', {
        method: 'POST',
        body: JSON.stringify({ dataUrl, fileName })
      });

      const hostedUrl = String(data?.url || '').trim();
      if (!hostedUrl) {
        throw new Error('图床未返回网址，请稍后再试。');
      }
      return hostedUrl;
    }

    function renderRecordSelectOptions(records) {
      const options = ['<option value="">请选择案件</option>'].concat(records.map((record) => {
        const title = record.title || '未命名案件';
        return '<option value="' + escapeText(record.id) + '">' + escapeText(title) + '</option>';
      }));
      recordSelect.innerHTML = options.join('');
      photoRecordSelect.innerHTML = options.join('');
    }

    async function requestJson(url, options) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const rawText = await response.text();
      let data = {};
      try {
        data = rawText ? JSON.parse(rawText) : {};
      } catch (_) {
        data = {};
      }
      if (!response.ok) {
        const errorText = data.error || ('请求失败（HTTP ' + response.status + '）。');
        throw new Error(errorText);
      }
      return data;
    }

    function clearServerSessionSilently() {
      return fetch('/api/admin/logout', {
        method: 'POST',
        credentials: 'same-origin',
        keepalive: true
      }).catch(() => {
      });
    }

    async function loadAdminData() {
      const data = await requestJson('/api/admin/data');
      const profile = data.profile || {};
      recordsCache = data.records || [];
      displayNameEdit.value = profile.display_name || '';
      avatarUrlEdit.value = profile.avatar_url || '';
      issuingPlaceEdit.value = profile.issuing_place || '';
      idNumberEdit.value = profile.id_number || '';
      renderRecordSelectOptions(recordsCache);

      if (recordsCache.length) {
        recordSelect.value = recordsCache[0].id;
        photoRecordSelect.value = recordsCache[0].id;
        recordTitleEdit.value = recordsCache[0].title || '';
        recordInfoEdit.value = recordsCache[0].info_text || '';
      } else {
        recordTitleEdit.value = '';
        recordInfoEdit.value = '';
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage();

      const loginId = adminLoginInput.value.trim();
      const password = passwordInput.value;

      if (!loginId || !password) {
        showMessage('请先输入账号与密码。', 'error');
        return;
      }

      if (loginId !== SHARED_ADMIN_LOGIN) {
        showMessage('登录失败：请使用指定的管理员账号。', 'error');
        return;
      }

      try {
        await requestJson('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ loginId, password })
        });
        await loadAdminData();
        adminPanel.classList.add('show');
        showMessage('已登录后台，可开始维护资料。', 'ok');
      } catch (error) {
        showMessage('登录失败：' + (error?.message || '未知错误'), 'error');
      }
    });

    recordSelect.addEventListener('change', () => {
      const selectedId = recordSelect.value;
      const found = recordsCache.find((record) => record.id === selectedId);
      if (!found) return;
      recordTitleEdit.value = found.title || '';
      recordInfoEdit.value = found.info_text || '';
      photoRecordSelect.value = selectedId;
    });

    saveProfileBtn.addEventListener('click', async () => {
      try {
        const payload = {
          display_name: displayNameEdit.value.trim() || null,
          avatar_url: avatarUrlEdit.value.trim() || null,
          issuing_place: issuingPlaceEdit.value.trim() || null,
          id_number: idNumberEdit.value.trim() || null
        };
        await requestJson('/api/admin/profile', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        await loadAdminData();
        showMessage('基本资料已更新。', 'ok');
      } catch (error) {
        showMessage('更新基本资料失败：' + (error?.message || '未知错误'), 'error');
      }
    });

    updateRecordBtn.addEventListener('click', async () => {
      try {
        const selectedId = recordSelect.value;
        if (!selectedId) {
          showMessage('请先选择要更新的案件。', 'error');
          return;
        }

        const payload = {
          title: recordTitleEdit.value.trim() || '未命名案件',
          info_text: recordInfoEdit.value.trim() || ''
        };
        await requestJson('/api/admin/records?id=' + encodeURIComponent(selectedId), {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
        await loadAdminData();
        showMessage('案件资料已更新。', 'ok');
      } catch (error) {
        showMessage('更新案件失败：' + (error?.message || '未知错误'), 'error');
      }
    });

    createRecordBtn.addEventListener('click', async () => {
      try {
        const payload = {
          title: recordTitleEdit.value.trim() || '未命名案件',
          info_text: recordInfoEdit.value.trim() || ''
        };
        await requestJson('/api/admin/records', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        await loadAdminData();
        showMessage('新案件已新增。', 'ok');
      } catch (error) {
        showMessage('新增案件失败：' + (error?.message || '未知错误'), 'error');
      }
    });

    deleteRecordBtn.addEventListener('click', async () => {
      try {
        const selectedId = recordSelect.value;
        if (!selectedId) {
          showMessage('请先选择要删除的案件。', 'error');
          return;
        }

        const selected = recordsCache.find((record) => record.id === selectedId);
        const selectedTitle = selected?.title || '未命名案件';
        const confirmed = window.confirm('确定要删除案件「' + selectedTitle + '」吗？\n此操作无法恢复。');
        if (!confirmed) {
          return;
        }

        await requestJson('/api/admin/records?id=' + encodeURIComponent(selectedId), {
          method: 'DELETE'
        });
        await loadAdminData();
        showMessage('案件已删除。', 'ok');
      } catch (error) {
        showMessage('删除案件失败：' + (error?.message || '未知错误'), 'error');
      }
    });

    addPhotoBtn.addEventListener('click', async () => {
      try {
        const recordId = photoRecordSelect.value;
        const selectedFile = photoFileInput.files && photoFileInput.files[0];
        if (!recordId) {
          showMessage('请先选择要加照片的案件。', 'error');
          return;
        }
        if (!selectedFile) {
          showMessage('请先选择照片文件。', 'error');
          return;
        }

        if (!selectedFile.type || !selectedFile.type.startsWith('image/')) {
          showMessage('只支持图片文件，请重新选择。', 'error');
          return;
        }

        addPhotoBtn.disabled = true;
        showMessage('照片处理中，请稍候...', 'ok');
        const photoDataUrl = await fileToCompressedDataUrl(selectedFile);
        const hostedUrl = await uploadImageAndGetUrl(photoDataUrl, selectedFile.name || 'case-photo.jpg');

        const payload = {
          record_id: recordId,
          photo_url: hostedUrl,
          caption: photoCaptionInput.value.trim() || null
        };
        await requestJson('/api/admin/photos', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        photoFileInput.value = '';
        photoCaptionInput.value = '';
        photoPreview.hidden = true;
        photoPreviewImg.removeAttribute('src');
        await loadAdminData();
        showMessage('照片已新增（已自动转成网址）。', 'ok');
      } catch (error) {
        showMessage('新增照片失败：' + (error?.message || '未知错误'), 'error');
      } finally {
        addPhotoBtn.disabled = false;
      }
    });

    photoFileInput.addEventListener('change', () => {
      const file = photoFileInput.files && photoFileInput.files[0];
      if (!file) {
        photoPreview.hidden = true;
        photoPreviewImg.removeAttribute('src');
        return;
      }

      if (!file.type || !file.type.startsWith('image/')) {
        showMessage('只支持图片文件，请重新选择。', 'error');
        photoFileInput.value = '';
        photoPreview.hidden = true;
        photoPreviewImg.removeAttribute('src');
        return;
      }

      const objectUrl = URL.createObjectURL(file);
      photoPreviewImg.src = objectUrl;
      photoPreview.hidden = false;
      photoPreviewImg.onload = () => URL.revokeObjectURL(objectUrl);
    });

    clearServerSessionSilently();

    window.addEventListener('pagehide', () => {
      clearServerSessionSilently();
    });
  </script>
</body>
</html>
