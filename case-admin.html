<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案件后台管理 - 公安便民入口</title>
  <style>
    :root { --red:#c90822; --deep-red:#a40018; --blue:#123c77; --ink:#242424; --paper:#f5f6f7; --ok:#287342; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif; }
    a { color:inherit; text-decoration:none; }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; }
    .site-header { background:#fff; border-top:3px solid #1f1f1f; }
    .masthead, .nav-inner, main, .site-footer-inner { width:min(1100px, calc(100% - 32px)); margin:auto; }
    .masthead { min-height:96px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .identity { display:block; min-width:0; flex:1; }
    .brand-left { width:100%; max-width:840px; height:auto; display:block; }
    .brand-right { width:min(240px, 28vw); min-width:130px; height:auto; display:block; }
    .return-home { border:1px solid #d7b8b8; border-radius:3px; color:#9c3340; padding:6px 12px; font-size:13px; }
    .nav-bar { background:var(--red); box-shadow:0 2px 4px #0002; }
    .nav-inner { display:flex; justify-content:space-between; }
    .nav-inner a { color:#fff; min-width:145px; padding:13px 24px; text-align:center; font-weight:700; font-size:15px; }
    .nav-inner a:hover, .nav-inner a.active { background:var(--deep-red); }
    main { min-height:670px; padding:42px 0 70px; }
    .panel { width:min(1020px, 100%); margin:0 auto; background:#fff; border:1px solid #e3e3e3; border-top:4px solid var(--red); border-radius:7px 7px 3px 3px; box-shadow:0 5px 16px #00000018; padding:27px 32px 31px; }
    .panel > h1 { margin:0; color:var(--red); text-align:center; font-size:24px; letter-spacing:1px; }
    .intro { margin:6px 0 25px; color:#888; text-align:center; font-size:13px; }
    .field { margin-bottom:14px; }
    .field label { display:block; margin:0 0 6px; color:#555; font-size:14px; font-weight:700; }
    input, select, textarea { width:100%; min-height:42px; padding:9px 12px; border:1px solid #bbb; border-radius:2px; color:#333; background:#fff; box-shadow:inset 0 1px 3px #0000000d; }
    textarea { min-height:96px; resize:vertical; }
    input:focus, select:focus, textarea:focus { outline:2px solid #d5223740; border-color:var(--red); }
    input:disabled, textarea:disabled, input[readonly] { color:#777; background:#f3f3f3; }
    .login-grid, .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .full { grid-column:1 / -1; }
    .submit, .btn { min-height:42px; border:0; border-radius:3px; padding:0 17px; color:#fff; background:var(--red); font-weight:700; box-shadow:0 2px 5px #8a001430; }
    .submit { width:100%; margin-top:4px; font-size:16px; letter-spacing:4px; }
    .submit:hover, .btn:hover { background:var(--deep-red); }
    .btn.secondary { background:#fff; color:#444; border:1px solid #aaa; box-shadow:none; }
    .btn.secondary:hover { background:#f3f3f3; }
    .btn.danger { background:#6b0f1a; }
    .btn.danger:hover { background:#520b14; }
    .btn:disabled { cursor:not-allowed; opacity:.55; }
    .msg { margin:14px 0 0; border-radius:4px; display:none; padding:10px 12px; font-size:13px; line-height:1.6; }
    .msg.show { display:block; }
    .msg.error { border:1px solid #f2d7a5; background:#fff8e7; color:#835812; }
    .msg.ok { border:1px solid #cfe7d5; background:#f2fbf4; color:#246f43; }
    .admin { display:none; margin-top:18px; }
    .admin.show { display:block; }
    .admin-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; padding:10px 12px; border:1px solid #e2e2e2; background:#f8f8f8; color:#555; font-size:13px; }
    .screen { display:none; }
    .screen.active { display:block; }
    .screen-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; padding-bottom:13px; border-bottom:1px solid #e5e5e5; }
    .screen-head h2 { margin:0; color:var(--blue); font-size:21px; }
    .screen-actions { display:flex; gap:9px; flex-wrap:wrap; }
    .entry-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:720px; margin:36px auto 18px; }
    .entry-button { min-height:170px; border:1px solid #d5d5d5; border-top:5px solid var(--red); border-radius:6px; background:#fff; color:var(--blue); font-size:22px; font-weight:700; box-shadow:0 4px 12px #00000012; }
    .entry-button:hover { border-color:#bd8790; background:#fff8f8; }
    .step-bar { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:22px; }
    .step { padding:10px 12px; border-bottom:3px solid #d4d4d4; color:#888; text-align:center; font-size:13px; font-weight:700; }
    .step.active { border-color:var(--red); color:var(--red); }
    .form-card { max-width:760px; margin:auto; padding:20px; border:1px solid #ddd; background:#fff; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
    .avatar-picker { position:relative; width:150px; height:180px; margin:0 auto 18px; border:1px dashed #999; background:#f3f4f5; overflow:hidden; cursor:pointer; }
    .avatar-picker img { width:100%; height:100%; object-fit:cover; display:block; }
    .avatar-placeholder { height:100%; display:grid; place-items:center; padding:16px; color:#666; text-align:center; line-height:1.6; }
    .upload-state { min-height:20px; margin-top:8px; color:var(--ok); text-align:center; font-size:12px; font-weight:700; }
    .people-toolbar { display:grid; grid-template-columns:minmax(220px, 1fr) auto; gap:12px; align-items:end; margin-bottom:16px; }
    .people-toolbar .field { margin:0; }
    .people-count { color:#666; font-size:13px; }
    .people-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
    .person-card { display:grid; grid-template-columns:92px 1fr; gap:14px; padding:15px; border:1px solid #ddd; border-left:4px solid var(--red); background:#fff; }
    .person-card-photo { width:92px; height:112px; border:1px solid #ddd; background:#f1f2f3; object-fit:cover; }
    .person-card-placeholder { display:grid; place-items:center; color:#888; font-size:12px; text-align:center; }
    .person-card h3 { margin:0 0 7px; font-size:18px; }
    .person-meta { margin:3px 0; color:#666; font-size:13px; line-height:1.5; word-break:break-word; }
    .person-card-actions { grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .person-card-actions .btn { padding:0 8px; font-size:13px; }
    .empty-state { padding:32px 16px; border:1px dashed #bbb; background:#fafafa; color:#666; text-align:center; }
    .record-switcher { display:grid; grid-template-columns:minmax(220px, 1fr) auto; gap:10px; align-items:end; margin-bottom:16px; }
    .record-switcher .field { margin:0; }
    .wanted-banner { margin-bottom:12px; overflow:hidden; background:#e9e9e9; }
    .wanted-banner img { width:100%; max-height:185px; object-fit:cover; display:block; }
    .wanted-editor { border:1px solid #c9c9c9; background:#fff; }
    .wanted-title { padding:10px 14px; background:var(--red); color:#fff; text-align:center; font-size:17px; font-weight:700; }
    .table-scroll { overflow-x:auto; }
    .wanted-table { width:100%; min-width:820px; border-collapse:collapse; table-layout:fixed; }
    .wanted-table col.label { width:105px; }
    .wanted-table col.value { width:auto; }
    .wanted-table col.portrait-col { width:178px; }
    .wanted-table th, .wanted-table td { border:1px solid #aaa; padding:7px; vertical-align:middle; }
    .wanted-table th { background:#f1f1f1; color:#333; font-size:13px; }
    .wanted-table input, .wanted-table textarea { min-height:38px; border-color:#aaa; box-shadow:none; }
    .wanted-table textarea { min-height:74px; }
    .portrait-cell { padding:9px !important; }
    .image-control { position:relative; border:1px dashed #8b8b8b; background:#f1f2f3; overflow:hidden; cursor:pointer; }
    .portrait-control { width:145px; height:178px; margin:auto; }
    .image-control img { width:100%; height:100%; object-fit:cover; display:block; }
    .image-placeholder { height:100%; display:grid; place-items:center; padding:12px; color:#666; text-align:center; font-size:12px; line-height:1.55; }
    .image-remove { position:absolute; top:5px; right:5px; width:28px; height:28px; border:0; border-radius:50%; background:#6b0f1ae8; color:#fff; font-weight:700; box-shadow:0 1px 4px #0005; }
    .image-busy::after { content:"上传中..."; position:absolute; inset:0; display:grid; place-items:center; background:#ffffffdc; color:var(--red); font-size:12px; font-weight:700; }
    .no-record { margin:14px; padding:18px; border:1px dashed #bbb; background:#fafafa; color:#666; text-align:center; }
    .attachments { padding:18px; border-top:1px solid #ccc; }
    .attachments h3 { margin:0 0 12px; color:var(--blue); font-size:16px; }
    .attachment-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
    .attachment-control { aspect-ratio:4 / 3; }
    .editor-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; flex-wrap:wrap; }
    .save-group { display:flex; align-items:center; gap:12px; margin-left:auto; }
    .save-state { min-width:60px; color:var(--ok); font-size:13px; font-weight:700; }
    .site-footer { background:#f0f0f0; border-top:1px solid #ddd; color:#777; }
    .site-footer-inner { padding:17px 0; font-size:12px; text-align:center; }
    [hidden] { display:none !important; }
    @media (max-width:700px) {
      .masthead { min-height:78px; }
      .brand-right { display:none; }
      .brand-left { max-width:100%; }
      .return-home { padding:5px 8px; font-size:12px; }
      .nav-inner { overflow:auto; justify-content:flex-start; }
      .nav-inner a { min-width:auto; white-space:nowrap; padding:12px 16px; font-size:14px; }
      main { padding-top:24px; }
      .panel { padding:22px 18px 26px; }
      .login-grid, .form-grid, .entry-grid, .people-grid, .people-toolbar, .record-switcher { grid-template-columns:1fr; }
      .entry-button { min-height:112px; }
      .screen-head { align-items:flex-start; flex-direction:column; }
      .screen-actions { width:100%; }
      .screen-actions .btn { flex:1; }
      .person-card { grid-template-columns:76px 1fr; }
      .person-card-photo { width:76px; height:94px; }
      .person-card-actions { grid-template-columns:1fr; }
      .attachment-grid { grid-template-columns:1fr; }
      .attachment-control { aspect-ratio:16 / 10; }
      .editor-footer { align-items:stretch; flex-direction:column; }
      .save-group { width:100%; margin-left:0; }
      .save-group .btn { flex:1; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <a class="identity" href="index (2).html" aria-label="返回首页">
        <img class="brand-left" src="https://cdn.phototourl.com/free/2026-07-24-aa9e6f2a-f3d3-4e47-9f03-173a0dc8ddad.png" alt="中华人民共和国公安部">
      </a>
      <img class="brand-right" src="https://cdn.phototourl.com/free/2026-07-24-24703616-4b7f-477d-b4c6-9d70ddd57ac8.png" alt="" aria-hidden="true">
      <a class="return-home" href="index (2).html">← 返回首页</a>
    </div>
    <nav class="nav-bar"><div class="nav-inner">
      <a href="index (2).html">首页</a><a href="mm1.html">便民服务</a><a href="case-search.html">案件查询</a><a class="active" href="case-admin.html">后台管理</a>
    </div></nav>
  </header>

  <main>
    <section class="panel">
      <h1>案件后台管理</h1>
      <p class="intro" id="pageIntro">管理员登录后即可新增人员或编辑已有资料。</p>
      <form id="loginForm">
        <div class="login-grid">
          <div class="field"><label for="adminLogin">登录账号</label><input id="adminLogin" autocomplete="username" placeholder="请输入管理员账号"></div>
          <div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
        </div>
        <button class="submit" type="submit">登录后台</button>
      </form>
      <div id="message" class="msg" aria-live="polite"></div>

      <div id="adminPanel" class="admin" aria-live="polite">
        <div class="admin-bar"><span id="adminLocation">管理首页</span><button class="btn secondary" id="logoutBtn" type="button">退出登录</button></div>

        <section class="screen" id="homeScreen">
          <div class="entry-grid">
            <button class="entry-button" id="startAddPersonBtn" type="button">新增人员</button>
            <button class="entry-button" id="openPeopleBtn" type="button">编辑已有资料</button>
          </div>
        </section>

        <section class="screen" id="peopleScreen">
          <div class="screen-head"><h2>选择人员</h2><div class="screen-actions"><button class="btn secondary" id="peopleHomeBtn" type="button">返回管理首页</button><button class="btn" id="peopleAddBtn" type="button">新增人员</button></div></div>
          <div class="people-toolbar"><div class="field"><label for="peopleSearch">搜索姓名</label><input id="peopleSearch" type="search" placeholder="输入姓名" autocomplete="off"></div><span id="peopleCount" class="people-count"></span></div>
          <div id="peopleGrid" class="people-grid"></div>
        </section>

        <section class="screen" id="addPersonScreen">
          <div class="screen-head"><h2>新增人员</h2><button class="btn secondary back-people" type="button">返回人员列表</button></div>
          <div class="step-bar"><div class="step active">1　人员资料</div><div class="step">2　第一笔案件（可略过）</div></div>
          <div class="form-card">
            <input id="newAvatarFile" type="file" accept="image/*" hidden>
            <div class="avatar-picker" id="newAvatarPicker" role="button" tabindex="0" aria-label="上传头像"><div id="newAvatarPlaceholder" class="avatar-placeholder">点击上传头像</div><img id="newAvatarPreview" alt="头像预览" hidden></div>
            <div id="newAvatarState" class="upload-state" aria-live="polite"></div>
            <div class="form-grid">
              <div class="field"><label for="newName">姓名 *</label><input id="newName" placeholder="请输入姓名"></div>
              <div class="field"><label for="newIdNumber">证件号码</label><input id="newIdNumber" placeholder="请输入证件号码"></div>
              <div class="field"><label for="newGender">性别</label><input id="newGender" placeholder="例如：男 / 女"></div>
              <div class="field"><label for="newBirthDate">出生日期</label><input id="newBirthDate" placeholder="例如：1980-01-01"></div>
              <div class="field full"><label for="newHousehold">户籍地</label><input id="newHousehold" placeholder="请输入户籍地"></div>
            </div>
            <div class="form-actions"><button class="btn" id="createPersonNextBtn" type="button">保存并下一步</button></div>
          </div>
        </section>

        <section class="screen" id="editorScreen">
          <div class="screen-head"><h2 id="editorHeading">编辑已有资料</h2><button class="btn secondary back-people" type="button">返回人员列表</button></div>
          <div id="wizardSteps" class="step-bar" hidden><div class="step">1　人员资料</div><div class="step active">2　第一笔案件（可略过）</div></div>
          <div id="recordSwitcher" class="record-switcher"><div class="field"><label for="recordSelect">当前案件</label><select id="recordSelect"></select></div></div>
          <div class="wanted-banner"><img src="https://i.ibb.co/mFPGVdX0/t.jpg" alt="公安部专案通缉令"></div>
          <div class="wanted-editor">
            <div class="wanted-title">专案通缉令资料</div>
            <div class="table-scroll"><table class="wanted-table">
              <colgroup><col class="label"><col class="value"><col class="label"><col class="value"><col class="portrait-col"></colgroup>
              <tbody>
                <tr><th>姓名</th><td><input id="editName" aria-label="姓名"></td><th>通缉日期</th><td><input id="editWantedDate" aria-label="通缉日期"></td><td class="portrait-cell" rowspan="4"><input id="editAvatarFile" type="file" accept="image/*" hidden><div class="image-control portrait-control" id="editAvatarControl" role="button" tabindex="0" aria-label="更换头像"><div id="editAvatarPlaceholder" class="image-placeholder">点击上传头像</div><img id="editAvatarImage" alt="头像" hidden><button class="image-remove" id="removeAvatarBtn" type="button" aria-label="删除头像" hidden>×</button></div></td></tr>
                <tr><th>性别</th><td><input id="editGender" aria-label="性别"></td><th>现在身份</th><td><input id="editIdentity" aria-label="现在身份"></td></tr>
                <tr><th>出生日期</th><td><input id="editBirthDate" aria-label="出生日期"></td><th>身份证号</th><td><input id="editIdNumber" aria-label="身份证号"></td></tr>
                <tr><th>户籍地</th><td><input id="editHousehold" aria-label="户籍地"></td><th>案件编号</th><td><input id="editRecordTitle" aria-label="案件编号"></td></tr>
                <tr><th>涉案类别</th><td colspan="4"><input id="editCategory" aria-label="涉案类别"></td></tr>
                <tr><th>现在住址</th><td colspan="4"><input id="editAddress" aria-label="现在住址"></td></tr>
                <tr><th>立案单位</th><td colspan="4"><input id="editFilingUnit" aria-label="立案单位"></td></tr>
                <tr><th>简要案情</th><td colspan="4"><textarea id="editSummary" aria-label="简要案情"></textarea></td></tr>
                <tr><th>备注</th><td colspan="4"><textarea id="editNotes" aria-label="备注"></textarea></td></tr>
                <tr><th>申请事项</th><td colspan="4"><textarea id="editApplication" aria-label="申请事项"></textarea></td></tr>
              </tbody>
            </table></div>
            <div id="noRecordNotice" class="no-record" hidden>该人员目前没有案件。</div>
            <section class="attachments" id="attachmentsSection"><h3>案件附件照片</h3><input id="attachmentFile" type="file" accept="image/*" hidden><div id="attachmentGrid" class="attachment-grid"></div></section>
          </div>
          <div class="editor-footer"><button class="btn danger" id="deleteRecordBtn" type="button">删除当前案件</button><button class="btn secondary" id="skipCaseBtn" type="button" hidden>略过案件</button><div class="save-group"><span id="saveState" class="save-state" aria-live="polite"></span><button class="btn" id="saveAllBtn" type="button">保存全部</button></div></div>
        </section>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="site-footer-inner">本页为管理员专用，请勿提供给普通案件查询用户。</div></footer>

  <script>
    const loginForm = document.querySelector('#loginForm');
    const adminLoginInput = document.querySelector('#adminLogin');
    const passwordInput = document.querySelector('#password');
    const pageIntro = document.querySelector('#pageIntro');
    const messageBox = document.querySelector('#message');
    const adminPanel = document.querySelector('#adminPanel');
    const adminLocation = document.querySelector('#adminLocation');
    const screens = Array.from(document.querySelectorAll('.screen'));
    const peopleSearch = document.querySelector('#peopleSearch');
    const peopleGrid = document.querySelector('#peopleGrid');
    const peopleCount = document.querySelector('#peopleCount');
    const newAvatarFile = document.querySelector('#newAvatarFile');
    const newAvatarPicker = document.querySelector('#newAvatarPicker');
    const newAvatarPreview = document.querySelector('#newAvatarPreview');
    const newAvatarPlaceholder = document.querySelector('#newAvatarPlaceholder');
    const newAvatarState = document.querySelector('#newAvatarState');
    const newName = document.querySelector('#newName');
    const newIdNumber = document.querySelector('#newIdNumber');
    const newGender = document.querySelector('#newGender');
    const newBirthDate = document.querySelector('#newBirthDate');
    const newHousehold = document.querySelector('#newHousehold');
    const editorHeading = document.querySelector('#editorHeading');
    const wizardSteps = document.querySelector('#wizardSteps');
    const recordSwitcher = document.querySelector('#recordSwitcher');
    const recordSelect = document.querySelector('#recordSelect');
    const editName = document.querySelector('#editName');
    const editWantedDate = document.querySelector('#editWantedDate');
    const editGender = document.querySelector('#editGender');
    const editIdentity = document.querySelector('#editIdentity');
    const editBirthDate = document.querySelector('#editBirthDate');
    const editIdNumber = document.querySelector('#editIdNumber');
    const editHousehold = document.querySelector('#editHousehold');
    const editRecordTitle = document.querySelector('#editRecordTitle');
    const editCategory = document.querySelector('#editCategory');
    const editAddress = document.querySelector('#editAddress');
    const editFilingUnit = document.querySelector('#editFilingUnit');
    const editSummary = document.querySelector('#editSummary');
    const editNotes = document.querySelector('#editNotes');
    const editApplication = document.querySelector('#editApplication');
    const editAvatarFile = document.querySelector('#editAvatarFile');
    const editAvatarControl = document.querySelector('#editAvatarControl');
    const editAvatarImage = document.querySelector('#editAvatarImage');
    const editAvatarPlaceholder = document.querySelector('#editAvatarPlaceholder');
    const removeAvatarBtn = document.querySelector('#removeAvatarBtn');
    const noRecordNotice = document.querySelector('#noRecordNotice');
    const attachmentsSection = document.querySelector('#attachmentsSection');
    const attachmentFile = document.querySelector('#attachmentFile');
    const attachmentGrid = document.querySelector('#attachmentGrid');
    const deleteRecordBtn = document.querySelector('#deleteRecordBtn');
    const skipCaseBtn = document.querySelector('#skipCaseBtn');
    const saveAllBtn = document.querySelector('#saveAllBtn');
    const saveState = document.querySelector('#saveState');
    const profileInputs = [editName, editGender, editIdentity, editBirthDate, editIdNumber, editHousehold];
    const recordInputs = [editWantedDate, editRecordTitle, editCategory, editAddress, editFilingUnit, editSummary, editNotes, editApplication];
    let profilesCache = [];
    let recordsCache = [];
    let photosByRecordId = Object.create(null);
    let selectedProfileId = '';
    let selectedRecordId = '';
    let editorMode = 'edit';
    let pendingAvatarUrl = '';
    let selectedAttachmentIndex = 0;
    let isDirty = false;

    function showMessage(text, type = 'ok') { messageBox.textContent = text; messageBox.className = 'msg show ' + type; }
    function clearMessage() { messageBox.textContent = ''; messageBox.className = 'msg'; }
    function escapeText(value) { return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char] || char)); }
    function showScreen(screenId, locationText) { screens.forEach((screen) => screen.classList.toggle('active', screen.id === screenId)); adminLocation.textContent = locationText; clearMessage(); window.scrollTo({ top:0, behavior:'smooth' }); }
    function confirmDiscard() { return !isDirty || window.confirm('目前有尚未保存的修改，确定要离开吗？'); }
    function getProfile(profileId = selectedProfileId) { return profilesCache.find((profile) => String(profile.id) === String(profileId)) || null; }
    function getRecord(recordId = selectedRecordId) { return recordsCache.find((record) => String(record.id) === String(recordId)) || null; }
    function getProfileRecords(profileId = selectedProfileId) { return recordsCache.filter((record) => String(record.profile_id) === String(profileId)); }
    function normalizeProfiles(data) { return (Array.isArray(data.profiles) ? data.profiles : []).filter(Boolean).map((profile, index) => ({ ...profile, id:profile.id || ('profile-' + index) })); }

    async function requestJson(url, options) {
      const response = await fetch(url, { credentials:'same-origin', headers:{ 'Content-Type':'application/json' }, ...options });
      const rawText = await response.text();
      let data = {};
      try { data = rawText ? JSON.parse(rawText) : {}; } catch (_) { data = {}; }
      if (!response.ok) throw new Error(data.error || ('请求失败（HTTP ' + response.status + '）。'));
      return data;
    }
    function clearServerSessionSilently() { return fetch('/api/admin/logout', { method:'POST', credentials:'same-origin', keepalive:true }).catch(() => {}); }
    async function loadAdminData() {
      const data = await requestJson('/api/admin/data');
      profilesCache = normalizeProfiles(data);
      recordsCache = Array.isArray(data.records) ? data.records : [];
      photosByRecordId = Object.create(null);
      (data.photos || []).forEach((photo) => { const id = String(photo?.record_id || ''); if (!id) return; if (!photosByRecordId[id]) photosByRecordId[id] = []; photosByRecordId[id].push(photo); });
    }

    function fileToImage(file) {
      return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => { const image = new Image(); image.onload = () => resolve(image); image.onerror = () => reject(new Error('图片读取失败，请改用 JPG 或 PNG。')); image.src = String(reader.result || ''); }; reader.onerror = () => reject(new Error('图片读取失败，请重新选择文件。')); reader.readAsDataURL(file); });
    }
    async function fileToCompressedDataUrl(file) {
      if (!file?.type?.startsWith('image/')) throw new Error('只支持图片文件。');
      const image = await fileToImage(file);
      const ratio = Math.min(1600 / image.width, 1600 / image.height, 1);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.width * ratio)); canvas.height = Math.max(1, Math.round(image.height * ratio));
      const context = canvas.getContext('2d'); if (!context) throw new Error('浏览器不支持图片处理。');
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      let dataUrl = canvas.toDataURL('image/jpeg', .82); if (dataUrl.length > 1900000) dataUrl = canvas.toDataURL('image/jpeg', .7); if (dataUrl.length > 1900000) throw new Error('照片过大，请选择较小的照片。');
      return dataUrl;
    }
    async function uploadImage(file) {
      const data = await requestJson('/api/admin/upload-image', { method:'POST', body:JSON.stringify({ dataUrl:await fileToCompressedDataUrl(file), fileName:file.name || 'case-photo.jpg' }) });
      const url = String(data?.url || '').trim(); if (!url) throw new Error('图片上传后没有返回网址。'); return url;
    }

    function resetNewPersonForm() {
      [newName, newIdNumber, newGender, newBirthDate, newHousehold].forEach((input) => { input.value = ''; });
      newAvatarFile.value = ''; pendingAvatarUrl = ''; newAvatarPreview.hidden = true; newAvatarPreview.removeAttribute('src'); newAvatarPlaceholder.hidden = false; newAvatarState.textContent = ''; isDirty = false;
    }
    function renderPeople() {
      const query = peopleSearch.value.trim().toLocaleLowerCase();
      const profiles = [...profilesCache].sort((a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || ''))).filter((profile) => !query || String(profile.display_name || '').toLocaleLowerCase().includes(query));
      peopleCount.textContent = query ? '找到 ' + profiles.length + ' 位人员' : '共 ' + profiles.length + ' 位人员';
      if (!profiles.length) { peopleGrid.innerHTML = '<div class="empty-state">' + (query ? '没有找到符合姓名的人员。' : '目前还没有人员资料。') + '</div>'; return; }
      peopleGrid.innerHTML = profiles.map((profile) => {
        const records = getProfileRecords(profile.id); const latest = records[0]; const extra = Math.max(0, records.length - 1);
        const photo = profile.avatar_url ? '<img class="person-card-photo" src="' + escapeText(profile.avatar_url) + '" alt="' + escapeText(profile.display_name || '人员') + '头像">' : '<div class="person-card-photo person-card-placeholder">暂无头像</div>';
        const caseText = latest ? escapeText(latest.title || '未命名案件') + (extra ? '，另有 ' + extra + ' 笔' : '') : '暂无案件';
        return '<article class="person-card" data-profile-id="' + escapeText(profile.id) + '">' + photo + '<div><h3>' + escapeText(profile.display_name || '未填写姓名') + '</h3><p class="person-meta">证件号码：' + escapeText(profile.id_number || '未填写') + '</p><p class="person-meta">案件：' + caseText + '</p></div><div class="person-card-actions"><button class="btn card-edit" type="button">编辑资料</button><button class="btn secondary card-add-case" type="button">新增案件</button><button class="btn danger card-delete" type="button">删除人员</button></div></article>';
      }).join('');
    }
    function openPeopleScreen() { if (!confirmDiscard()) return; isDirty = false; peopleSearch.value = ''; renderPeople(); showScreen('peopleScreen', '人员列表'); }
    function setAvatarDisplay(url) { const clean = String(url || '').trim(); editAvatarImage.hidden = !clean; editAvatarPlaceholder.hidden = Boolean(clean); removeAvatarBtn.hidden = !clean || editorMode === 'add'; if (clean) editAvatarImage.src = clean; else editAvatarImage.removeAttribute('src'); }
    function setEditorInputMode(profileReadonly, recordDisabled) { profileInputs.forEach((input) => { input.readOnly = profileReadonly; }); editAvatarControl.style.cursor = profileReadonly ? 'default' : 'pointer'; editAvatarControl.setAttribute('aria-disabled', profileReadonly ? 'true' : 'false'); recordInputs.forEach((input) => { input.disabled = recordDisabled; }); }
    function fillEditor(profile, record) {
      editName.value = profile?.display_name || ''; editGender.value = profile?.gender || ''; editIdentity.value = profile?.current_identity || ''; editBirthDate.value = profile?.birth_date || ''; editIdNumber.value = profile?.id_number || ''; editHousehold.value = profile?.household_registration || profile?.issuing_place || ''; setAvatarDisplay(profile?.avatar_url || '');
      editWantedDate.value = record?.wanted_date || ''; editRecordTitle.value = record?.title || ''; editCategory.value = record?.case_category || ''; editAddress.value = record?.current_address || ''; editFilingUnit.value = record?.filing_unit || ''; editSummary.value = record?.case_summary || record?.info_text || ''; editNotes.value = record?.notes || ''; editApplication.value = record?.application_request || '';
      const noRecord = editorMode === 'edit' && !record; noRecordNotice.hidden = !noRecord; attachmentsSection.hidden = noRecord; deleteRecordBtn.hidden = !record || editorMode === 'add'; setEditorInputMode(editorMode === 'add', noRecord); renderAttachments(); isDirty = false; saveState.textContent = '';
    }
    function renderRecordOptions(records) { if (!records.length) { recordSelect.innerHTML = '<option value="">暂无案件</option>'; return; } recordSelect.innerHTML = records.map((record) => '<option value="' + escapeText(record.id) + '">' + escapeText(record.title || '未命名案件') + '</option>').join(''); recordSelect.value = selectedRecordId; }
    function renderAttachments() {
      const photos = selectedRecordId ? (photosByRecordId[selectedRecordId] || []) : [];
      attachmentGrid.innerHTML = Array.from({ length:3 }, (_, index) => { const photo = photos[index]; const content = photo ? '<img src="' + escapeText(photo.photo_url || '') + '" alt="案件附件照片 ' + (index + 1) + '"><button class="image-remove remove-photo" data-photo-id="' + escapeText(photo.id) + '" type="button" aria-label="删除照片">×</button>' : '<div class="image-placeholder">点击上传附件照片 ' + (index + 1) + '</div>'; return '<div class="image-control attachment-control" data-photo-index="' + index + '" role="button" tabindex="0" aria-label="上传附件照片 ' + (index + 1) + '">' + content + '</div>'; }).join('');
    }
    function openEditor(profileId, mode = 'edit', recordId = '', fromWizard = false) {
      selectedProfileId = String(profileId || ''); editorMode = mode; const profile = getProfile(); const records = getProfileRecords(); selectedRecordId = mode === 'add' ? '' : String(recordId || records[0]?.id || '');
      editorHeading.textContent = mode === 'add' ? '新增案件' : '编辑已有资料'; wizardSteps.hidden = !fromWizard; recordSwitcher.hidden = mode === 'add'; skipCaseBtn.hidden = !fromWizard; saveAllBtn.textContent = mode === 'add' ? '保存案件' : '保存全部'; renderRecordOptions(records); fillEditor(profile, getRecord()); showScreen('editorScreen', mode === 'add' ? '新增案件' : '编辑已有资料');
    }
    function getProfilePayload(profile, avatarUrl = profile?.avatar_url || null) { return { id:profile?.id, display_name:editName.value.trim() || null, avatar_url:avatarUrl || null, issuing_place:editHousehold.value.trim() || null, id_number:editIdNumber.value.trim() || null, gender:editGender.value.trim() || null, birth_date:editBirthDate.value.trim() || null, current_identity:editIdentity.value.trim() || null, household_registration:editHousehold.value.trim() || null }; }
    function getCachedProfilePayload(profile, avatarUrl) { return { id:profile.id, display_name:profile.display_name || null, avatar_url:avatarUrl || null, issuing_place:profile.household_registration || profile.issuing_place || null, id_number:profile.id_number || null, gender:profile.gender || null, birth_date:profile.birth_date || null, current_identity:profile.current_identity || null, household_registration:profile.household_registration || profile.issuing_place || null }; }
    function getRecordPayload() { const summary = editSummary.value.trim(); return { profile_id:selectedProfileId, title:editRecordTitle.value.trim(), info_text:summary, wanted_date:editWantedDate.value.trim() || null, case_category:editCategory.value.trim() || null, current_address:editAddress.value.trim() || null, filing_unit:editFilingUnit.value.trim() || null, case_summary:summary || null, notes:editNotes.value.trim() || null, application_request:editApplication.value.trim() || null }; }
    async function createDraftRecordIfNeeded() { if (selectedRecordId) return selectedRecordId; const payload = getRecordPayload(); if (!payload.title) throw new Error('请先填写案件编号，再上传附件照片。'); const result = await requestJson('/api/admin/records', { method:'POST', body:JSON.stringify(payload) }); selectedRecordId = String(result?.record?.id || ''); if (!selectedRecordId) throw new Error('案件建立后没有返回 ID。'); recordsCache.unshift(result.record); return selectedRecordId; }
    async function saveEditor() {
      const profile = getProfile(); if (!profile) throw new Error('找不到人员资料。');
      if (editorMode === 'add') { const payload = getRecordPayload(); if (!payload.title) throw new Error('请填写案件编号。'); if (selectedRecordId) await requestJson('/api/admin/records?id=' + encodeURIComponent(selectedRecordId), { method:'PATCH', body:JSON.stringify(payload) }); else { const result = await requestJson('/api/admin/records', { method:'POST', body:JSON.stringify(payload) }); selectedRecordId = String(result?.record?.id || ''); } await loadAdminData(); openEditor(selectedProfileId, 'edit', selectedRecordId, false); saveState.textContent = '已保存'; return; }
      if (!editName.value.trim()) throw new Error('姓名不能为空。'); await requestJson('/api/admin/profile', { method:'POST', body:JSON.stringify(getProfilePayload(profile)) }); if (selectedRecordId) { const payload = getRecordPayload(); if (!payload.title) throw new Error('案件编号不能为空。'); await requestJson('/api/admin/records?id=' + encodeURIComponent(selectedRecordId), { method:'PATCH', body:JSON.stringify(payload) }); } await loadAdminData(); fillEditor(getProfile(), getRecord()); saveState.textContent = '已保存';
    }

    loginForm.addEventListener('submit', async (event) => { event.preventDefault(); clearMessage(); const loginId = adminLoginInput.value.trim(); const password = passwordInput.value; if (!loginId || !password) return showMessage('请先输入账号与密码。', 'error'); try { await requestJson('/api/admin/login', { method:'POST', body:JSON.stringify({ loginId, password }) }); await loadAdminData(); loginForm.hidden = true; pageIntro.hidden = true; adminPanel.classList.add('show'); showScreen('homeScreen', '管理首页'); } catch (error) { showMessage('登录失败：' + (error?.message || '未知错误'), 'error'); } });
    document.querySelector('#startAddPersonBtn').addEventListener('click', () => { resetNewPersonForm(); showScreen('addPersonScreen', '新增人员'); newName.focus(); });
    document.querySelector('#openPeopleBtn').addEventListener('click', openPeopleScreen);
    document.querySelector('#peopleHomeBtn').addEventListener('click', () => { if (confirmDiscard()) showScreen('homeScreen', '管理首页'); });
    document.querySelector('#peopleAddBtn').addEventListener('click', () => { resetNewPersonForm(); showScreen('addPersonScreen', '新增人员'); });
    document.querySelectorAll('.back-people').forEach((button) => button.addEventListener('click', openPeopleScreen));
    peopleSearch.addEventListener('input', renderPeople);
    [newName, newIdNumber, newGender, newBirthDate, newHousehold].forEach((input) => input.addEventListener('input', () => { isDirty = true; }));
    [...profileInputs, ...recordInputs].forEach((input) => input.addEventListener('input', () => { isDirty = true; saveState.textContent = '尚未保存'; }));
    function openFileInputOnKeyboard(event, input) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); input.click(); } }
    newAvatarPicker.addEventListener('click', () => newAvatarFile.click()); newAvatarPicker.addEventListener('keydown', (event) => openFileInputOnKeyboard(event, newAvatarFile));
    newAvatarFile.addEventListener('change', async () => { const file = newAvatarFile.files?.[0]; if (!file) return; try { newAvatarState.textContent = '头像上传中...'; pendingAvatarUrl = await uploadImage(file); newAvatarPreview.src = pendingAvatarUrl; newAvatarPreview.hidden = false; newAvatarPlaceholder.hidden = true; newAvatarState.textContent = '头像已上传'; isDirty = true; } catch (error) { newAvatarState.textContent = ''; showMessage('头像上传失败：' + (error?.message || '未知错误'), 'error'); } finally { newAvatarFile.value = ''; } });
    document.querySelector('#createPersonNextBtn').addEventListener('click', async () => { const name = newName.value.trim(); if (!name) return showMessage('请填写姓名。', 'error'); try { const result = await requestJson('/api/admin/profile', { method:'POST', body:JSON.stringify({ display_name:name, avatar_url:pendingAvatarUrl || null, id_number:newIdNumber.value.trim() || null, gender:newGender.value.trim() || null, birth_date:newBirthDate.value.trim() || null, current_identity:null, issuing_place:newHousehold.value.trim() || null, household_registration:newHousehold.value.trim() || null }) }); await loadAdminData(); isDirty = false; openEditor(result.profile.id, 'add', '', true); } catch (error) { showMessage('新增人员失败：' + (error?.message || '未知错误'), 'error'); } });
    peopleGrid.addEventListener('click', async (event) => { const card = event.target.closest('.person-card'); if (!card) return; const profileId = String(card.dataset.profileId || ''); if (event.target.closest('.card-edit')) return openEditor(profileId, 'edit'); if (event.target.closest('.card-add-case')) return openEditor(profileId, 'add'); if (event.target.closest('.card-delete')) { const profile = getProfile(profileId); if (!window.confirm('确定要删除人员「' + (profile?.display_name || '未填写姓名') + '」吗？\n该人员的案件和照片也会一起删除，无法恢复。')) return; try { await requestJson('/api/admin/profile?id=' + encodeURIComponent(profileId), { method:'DELETE' }); await loadAdminData(); renderPeople(); showMessage('人员资料已删除。', 'ok'); } catch (error) { showMessage('删除人员失败：' + (error?.message || '未知错误'), 'error'); } } });
    recordSelect.addEventListener('change', () => { if (!confirmDiscard()) { recordSelect.value = selectedRecordId; return; } selectedRecordId = recordSelect.value; fillEditor(getProfile(), getRecord()); });
    editAvatarControl.addEventListener('click', (event) => { if (event.target.closest('.image-remove') || editorMode === 'add') return; editAvatarFile.click(); });
    editAvatarControl.addEventListener('keydown', (event) => { if (editorMode !== 'add') openFileInputOnKeyboard(event, editAvatarFile); });
    editAvatarFile.addEventListener('change', async () => { const file = editAvatarFile.files?.[0]; const profile = getProfile(); if (!file || !profile) return; try { editAvatarControl.classList.add('image-busy'); const url = await uploadImage(file); await requestJson('/api/admin/profile', { method:'POST', body:JSON.stringify(getCachedProfilePayload(profile, url)) }); await loadAdminData(); setAvatarDisplay(getProfile()?.avatar_url || ''); saveState.textContent = '头像已保存'; } catch (error) { showMessage('头像上传失败：' + (error?.message || '未知错误'), 'error'); } finally { editAvatarControl.classList.remove('image-busy'); editAvatarFile.value = ''; } });
    removeAvatarBtn.addEventListener('click', async (event) => { event.stopPropagation(); const profile = getProfile(); if (!profile || !window.confirm('确定要删除头像吗？')) return; try { await requestJson('/api/admin/profile', { method:'POST', body:JSON.stringify(getCachedProfilePayload(profile, null)) }); await loadAdminData(); setAvatarDisplay(''); saveState.textContent = '头像已删除'; } catch (error) { showMessage('删除头像失败：' + (error?.message || '未知错误'), 'error'); } });
    attachmentGrid.addEventListener('click', async (event) => { const remove = event.target.closest('.remove-photo'); if (remove) { event.stopPropagation(); if (!window.confirm('确定要删除这张附件照片吗？')) return; try { await requestJson('/api/admin/photos?id=' + encodeURIComponent(remove.dataset.photoId || ''), { method:'DELETE' }); await loadAdminData(); renderAttachments(); saveState.textContent = '照片已删除'; } catch (error) { showMessage('删除照片失败：' + (error?.message || '未知错误'), 'error'); } return; } const slot = event.target.closest('.attachment-control'); if (!slot) return; selectedAttachmentIndex = Number(slot.dataset.photoIndex || 0); attachmentFile.click(); });
    attachmentGrid.addEventListener('keydown', (event) => { const slot = event.target.closest('.attachment-control'); if (!slot || (event.key !== 'Enter' && event.key !== ' ')) return; event.preventDefault(); selectedAttachmentIndex = Number(slot.dataset.photoIndex || 0); attachmentFile.click(); });
    attachmentFile.addEventListener('change', async () => { const file = attachmentFile.files?.[0]; if (!file) return; const slot = attachmentGrid.querySelector('[data-photo-index="' + selectedAttachmentIndex + '"]'); try { slot?.classList.add('image-busy'); await createDraftRecordIfNeeded(); const oldPhoto = (photosByRecordId[selectedRecordId] || [])[selectedAttachmentIndex]; const url = await uploadImage(file); if (oldPhoto) await requestJson('/api/admin/photos?id=' + encodeURIComponent(oldPhoto.id), { method:'DELETE' }); await requestJson('/api/admin/photos', { method:'POST', body:JSON.stringify({ record_id:selectedRecordId, photo_url:url, caption:null }) }); await loadAdminData(); renderAttachments(); saveState.textContent = '照片已保存'; } catch (error) { showMessage('照片上传失败：' + (error?.message || '未知错误'), 'error'); } finally { slot?.classList.remove('image-busy'); attachmentFile.value = ''; } });
    saveAllBtn.addEventListener('click', async () => { try { saveAllBtn.disabled = true; saveState.textContent = '保存中...'; await saveEditor(); isDirty = false; } catch (error) { saveState.textContent = ''; showMessage('保存失败：' + (error?.message || '未知错误'), 'error'); } finally { saveAllBtn.disabled = false; } });
    skipCaseBtn.addEventListener('click', () => { if (!confirmDiscard()) return; isDirty = false; openEditor(selectedProfileId, 'edit', '', false); });
    deleteRecordBtn.addEventListener('click', async () => { const record = getRecord(); if (!record || !window.confirm('确定要删除案件「' + (record.title || '未命名案件') + '」吗？\n此操作无法恢复。')) return; try { await requestJson('/api/admin/records?id=' + encodeURIComponent(record.id), { method:'DELETE' }); await loadAdminData(); const remaining = getProfileRecords(); selectedRecordId = remaining[0]?.id || ''; renderRecordOptions(remaining); fillEditor(getProfile(), getRecord()); saveState.textContent = '案件已删除'; } catch (error) { showMessage('删除案件失败：' + (error?.message || '未知错误'), 'error'); } });
    document.querySelector('#logoutBtn').addEventListener('click', async () => { if (!confirmDiscard()) return; await clearServerSessionSilently(); window.location.reload(); });
    window.addEventListener('beforeunload', (event) => { if (!isDirty) return; event.preventDefault(); event.returnValue = ''; });
    clearServerSessionSilently(); window.addEventListener('pagehide', clearServerSessionSilently);
  </script>
</body>
</html>
