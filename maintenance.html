<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>维护中</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #111;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    h1 {
      margin: 0;
      font-size: 64px;
      font-weight: 800;
      letter-spacing: 8px;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 44px;
        letter-spacing: 5px;
      }
    }
  </style>
</head>
<body>
  <h1>维护中</h1>
</body>
</html>
