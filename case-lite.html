<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>簡易案件查詢 - 公安便民入口</title>
  <style>
    :root { --red:#c90822; --deep-red:#a40018; --ink:#242424; --line:#d8d8d8; --paper:#f8f8f8; --muted:#707070; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .site-header { background:#fff; border-top:3px solid #1f1f1f; }
    .masthead, .nav-inner, main, .site-footer-inner { width:min(1100px, calc(100% - 32px)); margin:auto; }
    .masthead { min-height:96px; display:flex; align-items:center; justify-content:space-between; }
    .identity { display:flex; align-items:center; gap:15px; }
    .seal { width:50px; height:50px; border-radius:50%; display:grid; place-items:center; background:#d31024; color:#f8d64d; border:3px solid #f5cf45; font-size:26px; box-shadow:inset 0 0 0 2px #a90a19; }
    .title-group strong { display:block; color:#123c77; font-size:25px; letter-spacing:1px; line-height:1.25; }
    .title-group span { color:#777; font:12px/1.2 Georgia,serif; letter-spacing:.2px; }
    .return-home { border:1px solid #d7b8b8; border-radius:3px; color:#9c3340; padding:6px 12px; font-size:13px; }
    .nav-bar { background:var(--red); box-shadow:0 2px 4px #0002; }
    .nav-inner { display:flex; justify-content:space-between; }
    .nav-inner a { color:#fff; min-width:145px; padding:13px 24px; text-align:center; font-weight:700; font-size:15px; }
    .nav-inner a:hover, .nav-inner a.active { background:var(--deep-red); }
    main { min-height:670px; padding:42px 0 70px; }
    .panel { width:min(760px, 100%); margin:0 auto; background:#fff; border:1px solid #e3e3e3; border-top:4px solid var(--red); border-radius:7px 7px 3px 3px; box-shadow:0 5px 16px #00000018; padding:27px 32px 31px; }
    .panel h1 { margin:0; color:var(--red); text-align:center; font-size:24px; letter-spacing:1px; }
    .intro { margin:6px 0 25px; color:#9a9a9a; text-align:center; font-size:13px; }
    .login-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field label { display:block; margin:0 0 6px; color:#666; font-size:14px; font-weight:700; }
    .field input { width:100%; min-height:42px; padding:9px 12px; border:1px solid #bbb; border-radius:3px; color:#333; font:14px "Noto Sans TC","Microsoft JhengHei",sans-serif; }
    .field input:focus { outline:2px solid #d5223740; border-color:var(--red); }
    .submit { width:100%; min-height:44px; margin-top:16px; border:0; border-radius:3px; color:#fff; background:var(--red); font:700 16px "Noto Sans TC","Microsoft JhengHei",sans-serif; letter-spacing:5px; text-indent:5px; cursor:pointer; }
    .submit:hover { background:var(--deep-red); }
    .msg { margin-top:14px; border-radius:4px; display:none; padding:10px 12px; font-size:13px; line-height:1.6; }
    .msg.show { display:block; }
    .msg.error { background:#fff8e7; border:1px solid #f2d7a5; color:#835812; }
    .msg.ok { background:#f2fbf4; border:1px solid #cfe7d5; color:#246f43; }
    .result { display:none; margin-top:18px; border:1px solid #ebebeb; border-radius:4px; overflow:hidden; }
    .result.show { display:block; }
    .result-head { background:#f8f8f8; padding:10px 12px; font-size:13px; color:#555; border-bottom:1px solid #ebebeb; }
    .list { display:grid; gap:10px; padding:14px 12px; }
    .item { padding:10px 12px; border:1px solid #ececec; border-radius:4px; background:#fff; }
    .item .top { display:flex; justify-content:space-between; gap:10px; }
    .item .title { font-size:15px; font-weight:700; color:#123c77; }
    .item .time { font-size:12px; color:#999; white-space:nowrap; }
    .item .detail { margin-top:7px; color:#555; font-size:13px; line-height:1.6; white-space:pre-wrap; }
    .empty { padding:16px 12px; color:#777; font-size:13px; }
    .site-footer { background:#f0f0f0; border-top:1px solid #ddd; color:#777; }
    .site-footer-inner { padding:17px 0; font-size:12px; text-align:center; }
    @media (max-width:700px) {
      .masthead { min-height:78px; }
      .seal { width:40px; height:40px; font-size:21px; }
      .title-group strong { font-size:18px; }
      .title-group span { display:none; }
      .return-home { padding:5px 8px; font-size:12px; }
      .nav-inner { overflow:auto; justify-content:flex-start; }
      .nav-inner a { min-width:auto; white-space:nowrap; padding:12px 16px; font-size:14px; }
      .panel { padding:23px 22px 27px; }
      .login-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <a class="identity" href="index (2).html" aria-label="返回首頁">
        <span class="seal" aria-hidden="true">★</span>
        <span class="title-group"><strong>中華人民共和國公安部</strong><span>Ministry of Public Security of the People's Republic of China</span></span>
      </a>
      <a class="return-home" href="index (2).html">← 返回首頁</a>
    </div>
    <nav class="nav-bar"><div class="nav-inner">
      <a href="index (2).html">首頁</a><a href="mm1.html">便民服務</a><a class="active" href="case-lite.html">簡易查詢</a><a href="index (2).html">返回主站</a>
    </div></nav>
  </header>

  <main>
    <section class="panel">
      <h1>簡易案件查詢</h1>
      <p class="intro">只需輸入帳號密碼，登入後顯示你的案件清單。</p>

      <form id="loginForm">
        <div class="login-grid">
          <div class="field">
            <label for="loginId">帳號</label>
            <input id="loginId" autocomplete="username" placeholder="例如：test001">
          </div>
          <div class="field">
            <label for="password">密碼</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼">
          </div>
        </div>
        <button class="submit" type="submit">登 入 查 詢</button>
      </form>

      <div id="message" class="msg" aria-live="polite"></div>

      <div id="resultPanel" class="result" aria-live="polite">
        <div class="result-head">我的案件</div>
        <div id="recordsBox" class="list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="site-footer-inner">本頁為客戶簡易版入口，僅保留登入與案件資訊查詢。</div></footer>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://nbsbbpzaubllexbxomep.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Up5IGr7G8tE0eVEdHfqRXA_xBDFbUP-';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    });

    const loginForm = document.querySelector('#loginForm');
    const loginIdInput = document.querySelector('#loginId');
    const passwordInput = document.querySelector('#password');
    const messageBox = document.querySelector('#message');
    const resultPanel = document.querySelector('#resultPanel');
    const recordsBox = document.querySelector('#recordsBox');

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = 'msg show ' + type;
    }

    function emailFromLoginId(loginId) {
      const trimmed = (loginId || '').trim();
      if (!trimmed) return '';
      if (trimmed.includes('@')) return trimmed;
      return trimmed + '@case.local';
    }

    function escapeText(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char] || char));
    }

    function fmtTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString('zh-Hant', { hour12: false });
    }

    function renderRecords(records) {
      if (!records.length) {
        recordsBox.innerHTML = '<div class="empty">目前沒有可顯示的案件資料。</div>';
        return;
      }

      recordsBox.innerHTML = records.map((record) => {
        return '<div class="item">' +
          '<div class="top"><div class="title">' + escapeText(record.title || '未命名案件') + '</div><div class="time">' + fmtTime(record.created_at) + '</div></div>' +
          '<div class="detail">' + escapeText(record.info_text || '無補充資訊') + '</div>' +
        '</div>';
      }).join('');
    }

    async function loadRecords() {
      const { data: authData, error: authError } = await supabase.auth.getUser();
      if (authError) throw authError;
      const user = authData?.user;
      if (!user) throw new Error('找不到登入使用者');

      const { data, error } = await supabase
        .from('user_records')
        .select('title, info_text, created_at')
        .eq('auth_user_id', user.id)
        .order('created_at', { ascending: false });

      if (error) throw error;
      renderRecords(data || []);
      resultPanel.classList.add('show');
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const loginId = loginIdInput.value.trim();
      const password = passwordInput.value;
      const email = emailFromLoginId(loginId);

      if (!loginId || !password) {
        showMessage('請先輸入帳號與密碼。', 'error');
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        showMessage('登入失敗：' + error.message, 'error');
        return;
      }

      if (data?.session) {
        try {
          await loadRecords();
          showMessage('登入成功，已載入案件清單。', 'ok');
        } catch (loadError) {
          showMessage('登入成功，但載入案件失敗：' + (loadError?.message || '未知錯誤'), 'error');
        }
      }
    });
  </script>
</body>
</html>
